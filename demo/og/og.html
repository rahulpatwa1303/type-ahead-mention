<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../node_modules/@fontsource-variable/archivo/files/archivo-latin-standard-normal.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:C;src:url(../../node_modules/@fontsource/courier-prime/files/courier-prime-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:C;src:url(../../node_modules/@fontsource/courier-prime/files/courier-prime-latin-700-normal.woff2);font-weight:700}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f3f3ef;font-family:A;color:#16171a;padding:48px 60px;position:relative;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px double #d23a2b;padding-bottom:14px}
.no{font-stretch:68%;font-weight:820;font-size:30px;color:#d23a2b;text-transform:uppercase}
.rev{font-family:C;font-size:20px;color:#4f5158}
h1{font-stretch:64%;font-weight:840;font-size:112px;line-height:.9;margin:46px 0 0;letter-spacing:-.01em}
h1 span{color:#d23a2b}
.box{position:absolute;right:60px;bottom:120px;width:470px;border:2px solid #d23a2b;background:#fff;box-shadow:0 14px 30px -14px rgba(40,12,8,.35)}
.cap{font-stretch:75%;font-weight:650;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#b02a1d;padding:12px 16px 0;display:flex;align-items:center;gap:9px}
.n{background:#d23a2b;color:#fff;width:22px;height:22px;display:grid;place-items:center;font-size:14px}
.t{font-family:C;font-size:22px;padding:8px 16px 12px}
.v{background:rgba(210,58,43,.1);color:#b02a1d}
.pop{margin:0 16px 16px 120px;border:1.5px solid #d23a2b;font-family:C;font-size:19px}
.pop div{display:flex;justify-content:space-between;padding:6px 10px}
.pop .sel{background:#d23a2b;color:#fff}
.pop i{font-style:normal;color:#4f5158}.pop .sel i{color:#ffe}
.band{position:absolute;left:0;right:0;bottom:0;height:86px;background:#d23a2b;color:#fff;font-family:C;font-weight:700;font-size:36px;display:flex;align-items:center;padding:0 60px}
</style></head><body>
<div class="head"><span class="no">Form TAM-3</span><span class="rev">React · MIT · 7 kB first load</span></div>
<h1>Autocomplete<br>for <span>{{template.<br>variables}}</span></h1>
<div class="box"><div class="cap"><span class="n">2</span>Template</div>
<div class="t">Reply to <span class="v">{{user.name}}</span> in {{user.</div>
<div class="pop"><div class="sel">name<i>"Ada Lovelace"</i></div><div>plan<i>"Pro"</i></div><div>locale<i>"en-GB"</i></div></div></div>
<div class="band">npm install type-ahead-mention</div>
</body></html>
